openapi: 3.0.0
info:
  title: Starwest E-commerce API
  description: REST API for e-commerce with JWT authentication and checkout functionality
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: http://localhost:3000
    description: Development server

paths:
  /api/auth/login:
    post:
      summary: User login
      description: Authenticate user and get JWT token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/profile:
    get:
      summary: Get user profile
      description: Get current authenticated user profile
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User profile retrieved successfully
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/users:
    get:
      summary: Get all users
      description: Get list of all users (for testing purposes)
      tags:
        - Authentication
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Users retrieved successfully
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'

  /api/products:
    get:
      summary: Get all products
      description: Retrieve all available products
      tags:
        - Products
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Products retrieved successfully
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'

  /api/products/{id}:
    get:
      summary: Get product by ID
      description: Retrieve a specific product by its ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          description: Product ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Product retrieved successfully
                  data:
                    type: object
                    properties:
                      product:
                        $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/checkout:
    post:
      summary: Process checkout
      description: Process a checkout with payment method and items. Cash payments get 10% discount.
      tags:
        - Checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - paymentMethod
              properties:
                items:
                  type: array
                  description: Array of items to purchase
                  items:
                    type: object
                    required:
                      - productId
                      - quantity
                    properties:
                      productId:
                        type: integer
                        description: Product ID
                        example: 1
                      quantity:
                        type: integer
                        minimum: 1
                        description: Quantity to purchase
                        example: 2
                  example:
                    - productId: 1
                      quantity: 2
                    - productId: 2
                      quantity: 1
                paymentMethod:
                  type: string
                  enum: [cash, credit_card]
                  description: Payment method. Cash gives 10% discount.
                  example: cash
      responses:
        '201':
          description: Checkout completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Checkout completed successfully
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: john.doe@example.com
        name:
          type: string
          example: John Doe
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Wireless Headphones
        description:
          type: string
          example: High-quality wireless headphones with noise cancellation
        price:
          type: number
          format: float
          example: 199.99
        stock:
          type: integer
          example: 50
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1704067200000
        userId:
          type: integer
          example: 1
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: integer
                example: 1
              quantity:
                type: integer
                example: 2
              product:
                $ref: '#/components/schemas/Product'
        paymentMethod:
          type: string
          enum: [cash, credit_card]
          example: cash
        subtotal:
          type: number
          format: float
          example: 399.98
        discount:
          type: integer
          example: 10
        discountAmount:
          type: number
          format: float
          example: 39.998
        total:
          type: number
          format: float
          example: 359.98
        stockUpdateResults:
          type: array
          items:
            type: object
            properties:
              productId:
                type: integer
              name:
                type: string
              quantity:
                type: integer
              remainingStock:
                type: integer
              success:
                type: boolean
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    Error:
      type: object
      properties:
        error:
          type: string
          example: Validation error
        message:
          type: string
          example: Email and password are required
